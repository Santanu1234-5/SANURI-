<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SANURI - Forgot Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background-color: #030712; margin: 0; padding: 0; font-family: sans-serif; }
        
        .glass-panel {
            background: rgba(11, 17, 32, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(30, 41, 59, 0.8);
        }

        .auth-bg {
            background-image: url('https://images.unsplash.com/photo-1506443432602-ac2fcd6f54e0?auto=format&fit=crop&q=80');
            background-size: cover;
            background-position: center;
        }

        .spinner {
            border: 2px solid rgba(255,255,255,0.1);
            border-left-color: #ffffff;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            animation: spin 1s linear infinite;
            display: none;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Micro-animations */
        .fade-in { animation: fadeIn 0.8s ease-out forwards; opacity: 0; transform: translateY(10px); }
        .delay-100 { animation-delay: 100ms; }
        
        @keyframes fadeIn {
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="text-slate-300 antialiased min-h-screen flex items-center justify-center relative selection:bg-blue-500/30 selection:text-white p-6">
    
    <!-- Background -->
    <div class="fixed inset-0 auth-bg z-0">
        <div class="absolute inset-0 bg-gradient-to-br from-[#030712]/95 via-[#030712]/90 to-[#030712]/80"></div>
        <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-blue-600/10 blur-[120px] pointer-events-none rounded-full"></div>
    </div>

    <!-- Centered Form Card -->
    <div class="w-full max-w-md relative z-10 fade-in delay-100">
        <!-- Brand -->
        <div class="flex justify-center mb-10">
            <a href="index.html" class="flex items-center gap-2 text-white font-bold text-2xl tracking-tight hover:opacity-80 transition-opacity">
                <i data-lucide="hexagon" class="text-blue-500 fill-blue-500/20" width="28" height="28"></i>
                SANURI
            </a>
        </div>

        <div class="glass-panel p-8 sm:p-10 rounded-2xl shadow-2xl shadow-blue-900/10">
            <div class="mb-8 text-center">
                <div class="w-16 h-16 bg-blue-500/10 rounded-full flex items-center justify-center mx-auto mb-6">
                    <i data-lucide="key-round" class="text-blue-500" width="28" height="28"></i>
                </div>
                <h1 class="text-2xl font-bold text-white mb-2">Forgot password?</h1>
                <p class="text-slate-400 text-sm">Enter your email and we'll send you instructions to reset your password.</p>
            </div>

            <div id="error-message" class="hidden mb-6 p-4 rounded-xl bg-red-500/10 border border-red-500/20 text-red-400 text-sm flex items-start gap-3">
                <i data-lucide="alert-circle" width="18" height="18" class="shrink-0 mt-0.5"></i>
                <span id="error-text">An error occurred.</span>
            </div>

            <div id="success-message" class="hidden mb-6 p-4 rounded-xl bg-green-500/10 border border-green-500/20 text-green-400 text-sm flex items-start gap-3">
                <i data-lucide="check-circle-2" width="18" height="18" class="shrink-0 mt-0.5"></i>
                <span>Check your email for a reset link. You can close this window.</span>
            </div>

            <form id="forgot-form" class="space-y-5">
                <div class="space-y-2">
                    <label class="text-sm font-medium text-slate-300" for="email">Email address</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i data-lucide="mail" class="text-slate-500" width="18" height="18"></i>
                        </div>
                        <input id="email" type="email" required autocomplete="email" placeholder="you@example.com" 
                            class="w-full bg-[#030712] border border-slate-700 rounded-xl pl-11 pr-4 py-3.5 text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all placeholder:text-slate-600" />
                    </div>
                </div>

                <button type="submit" id="submit-btn" class="w-full flex items-center justify-center gap-2 bg-blue-600 hover:bg-blue-500 text-white rounded-xl py-3.5 font-medium transition-all active:scale-[0.98]">
                    <span id="btn-text">Send Reset Link</span>
                    <div class="spinner" id="spinner"></div>
                </button>
            </form>

            <div class="mt-8 text-center text-sm">
                <a href="login.html" class="flex items-center justify-center gap-2 text-slate-400 hover:text-white transition-colors">
                    <i data-lucide="arrow-left" width="16" height="16"></i>
                    Back to Login
                </a>
            </div>
        </div>
    </div>

    <!-- Supabase Logic -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/auth.js"></script>
    <script>
        lucide.createIcons();

        document.getElementById('forgot-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            
            const btnText = document.getElementById('btn-text');
            const spinner = document.getElementById('spinner');
            const submitBtn = document.getElementById('submit-btn');
            const errorBox = document.getElementById('error-message');
            const successBox = document.getElementById('success-message');
            const errorText = document.getElementById('error-text');

            btnText.textContent = 'Sending link...';
            spinner.style.display = 'block';
            submitBtn.disabled = true;
            errorBox.classList.add('hidden');
            successBox.classList.add('hidden');

            try {
                if (!window.supabaseClient) {
                    await window.initAuth();
                }

                const { data, error } = await window.supabaseClient.auth.resetPasswordForEmail(email, {
                    redirectTo: window.location.origin + '/reset-password.html'
                });

                if (error) throw error;
                
                successBox.classList.remove('hidden');
                document.getElementById('forgot-form').reset();
                
            } catch (err) {
                errorText.textContent = err.message || "Failed to send reset email.";
                errorBox.classList.remove('hidden');
            } finally {
                btnText.textContent = 'Send Reset Link';
                spinner.style.display = 'none';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
