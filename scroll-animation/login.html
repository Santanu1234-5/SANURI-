<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SANURI - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background-color: #030712; margin: 0; padding: 0; font-family: sans-serif; }
        
        .glass-panel {
            background: rgba(11, 17, 32, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(30, 41, 59, 0.8);
        }

        .auth-bg {
            background-image: url('https://images.unsplash.com/photo-1506443432602-ac2fcd6f54e0?auto=format&fit=crop&q=80');
            background-size: cover;
            background-position: center;
        }

        .spinner {
            border: 2px solid rgba(255,255,255,0.1);
            border-left-color: #ffffff;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            animation: spin 1s linear infinite;
            display: none;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Micro-animations */
        .fade-in { animation: fadeIn 0.8s ease-out forwards; opacity: 0; transform: translateY(10px); }
        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
        
        @keyframes fadeIn {
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="text-slate-300 antialiased min-h-screen flex selection:bg-blue-500/30 selection:text-white">

    <!-- Left visual side (hidden on mobile) -->
    <div class="hidden lg:flex lg:w-1/2 relative auth-bg items-center justify-center">
        <div class="absolute inset-0 bg-gradient-to-r from-[#030712]/90 to-[#030712]/40 mix-blend-multiply"></div>
        <div class="absolute inset-0 bg-blue-900/10 mix-blend-screen"></div>
        
        <div class="relative z-10 p-12 max-w-xl text-center fade-in">
            <h2 class="text-4xl font-bold text-white mb-4 tracking-tight">The Future of Digital Experiences</h2>
            <p class="text-slate-400 text-lg">Sign in to access your premium SANURI dashboard and continue creating.</p>
        </div>
    </div>

    <!-- Right form side -->
    <div class="w-full lg:w-1/2 flex items-center justify-center p-6 sm:p-12 relative overflow-hidden">
        <!-- Subtle background glow -->
        <div class="absolute top-0 right-0 w-64 h-64 bg-blue-600/10 blur-[100px] pointer-events-none rounded-full"></div>
        
        <div class="w-full max-w-md relative z-10">
            <!-- Brand -->
            <a href="index.html" class="flex items-center gap-2 text-white font-bold text-2xl tracking-tight mb-12 hover:opacity-80 transition-opacity fade-in w-fit">
                <i data-lucide="hexagon" class="text-blue-500 fill-blue-500/20" width="28" height="28"></i>
                SANURI
            </a>

            <!-- Form Card -->
            <div class="glass-panel p-8 sm:p-10 rounded-2xl shadow-2xl shadow-blue-900/5 fade-in delay-100">
                <div class="mb-8">
                    <h1 class="text-2xl font-bold text-white mb-2">Welcome back</h1>
                    <p class="text-slate-400 text-sm">Sign in to continue to SANURI</p>
                </div>

                <div id="error-message" class="hidden mb-6 p-4 rounded-xl bg-red-500/10 border border-red-500/20 text-red-400 text-sm flex items-start gap-3">
                    <i data-lucide="alert-circle" width="18" height="18" class="shrink-0 mt-0.5"></i>
                    <span id="error-text">Authentication failed.</span>
                </div>

                <form id="login-form" class="space-y-5">
                    <div class="space-y-2">
                        <label class="text-sm font-medium text-slate-300" for="email">Email</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <i data-lucide="mail" class="text-slate-500" width="18" height="18"></i>
                            </div>
                            <input id="email" type="email" required autocomplete="email" placeholder="you@example.com" 
                                class="w-full bg-[#030712] border border-slate-700 rounded-xl pl-11 pr-4 py-3.5 text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all placeholder:text-slate-600" />
                        </div>
                    </div>

                    <div class="space-y-2">
                        <div class="flex items-center justify-between">
                            <label class="text-sm font-medium text-slate-300" for="password">Password</label>
                            <a href="forgot-password.html" class="text-sm text-blue-400 hover:text-blue-300 transition-colors">Forgot Password?</a>
                        </div>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <i data-lucide="lock" class="text-slate-500" width="18" height="18"></i>
                            </div>
                            <input id="password" type="password" required autocomplete="current-password" placeholder="••••••••" 
                                class="w-full bg-[#030712] border border-slate-700 rounded-xl pl-11 pr-12 py-3.5 text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all placeholder:text-slate-600" />
                            <button type="button" id="toggle-password" class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-500 hover:text-slate-300 transition-colors">
                                <i data-lucide="eye" width="18" height="18" id="eye-icon"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" id="submit-btn" class="w-full flex items-center justify-center gap-2 bg-blue-600 hover:bg-blue-500 text-white rounded-xl py-3.5 font-medium transition-all active:scale-[0.98]">
                        <span id="btn-text">Sign In</span>
                        <div class="spinner" id="spinner"></div>
                    </button>
                </form>

                <div class="mt-8 relative">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-slate-800"></div>
                    </div>
                    <div class="relative flex justify-center text-sm">
                        <span class="px-4 bg-[#0b1120] text-slate-500">OR</span>
                    </div>
                </div>

                <div class="mt-8 text-center text-sm text-slate-400">
                    Don't have an account? 
                    <a href="signup.html" class="text-white hover:text-blue-400 font-medium transition-colors">Create Account</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Supabase Logic -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/auth.js"></script>
    <script>
        lucide.createIcons();

        // Password visibility toggle
        const passwordInput = document.getElementById('password');
        const toggleBtn = document.getElementById('toggle-password');
        const eyeIcon = document.getElementById('eye-icon');

        toggleBtn.addEventListener('click', () => {
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.setAttribute('data-lucide', 'eye-off');
            } else {
                passwordInput.type = 'password';
                eyeIcon.setAttribute('data-lucide', 'eye');
            }
            lucide.createIcons();
        });

        // Form submission
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = passwordInput.value;
            
            const btnText = document.getElementById('btn-text');
            const spinner = document.getElementById('spinner');
            const submitBtn = document.getElementById('submit-btn');
            const errorBox = document.getElementById('error-message');
            const errorText = document.getElementById('error-text');

            // UI Loading state
            btnText.textContent = 'Signing in...';
            spinner.style.display = 'block';
            submitBtn.disabled = true;
            errorBox.classList.add('hidden');

            try {
                // Wait for Supabase to be initialized if it's loading async
                if (!window.supabaseClient) {
                    await window.initAuth();
                }

                const { data, error } = await window.supabaseClient.auth.signInWithPassword({
                    email,
                    password
                });

                if (error) throw error;
                
                // Success - Redirect
                window.location.href = 'dashboard.html';
                
            } catch (err) {
                errorText.textContent = err.message || "Invalid email or password.";
                errorBox.classList.remove('hidden');
                
                btnText.textContent = 'Sign In';
                spinner.style.display = 'none';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
